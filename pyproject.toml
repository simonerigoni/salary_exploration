[project]
name = "salary-exploration"
version = "0.1.0"
description = "Salary exploration with Payscale"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dash-bootstrap-components>=2.0.2",
    "dash>=3.0.4",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.0.0",
    "selenium>=4.32.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
