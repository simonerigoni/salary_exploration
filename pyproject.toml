[project]
name = "salary-exploration"
version = "0.1.0"
description = "Salary exploration with Payscale"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "dash-bootstrap-components>=2.0.2",
    "dash>=3.0.4",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.0.0",
    "selenium>=4.32.0",
]


[project.urls]
Repository = "https://github.com/simonerigoni/salary_exploration"
Medium = "https://medium.com/@simone-rigoni01/salary-exploration-with-python-and-payscale-data-786e5557bcbc"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]
notebook = [
    "beautifulsoup4>=4.13.0",
    "ipykernel>=6.29.5",
    "requests>=2.32.0",
]

[project.scripts]
salary-exploration = "salary_exploration.exploration:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --durations=0"

[tool.coverage.run]
source = ["src"]
