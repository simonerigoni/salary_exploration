[project]
name = "salary-exploration"
version = "0.1.0"
description = "Salary exploration with Payscale"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dash-bootstrap-components>=2.0.2",
    "dash>=3.0.4",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.0.0",
    "selenium>=4.32.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Keep ruff's pre-0.17 default rule set so ruff upgrades don't enable new lint rules
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
